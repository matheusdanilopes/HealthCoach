name: Notifications Cron

on:
  schedule:
    # Roda a cada 2 horas (UTC). O backend ignora quiet hours (22h–7h BRT).
    # Horários ativos em BRT: 7h, 9h, 11h, 13h, 15h, 17h, 19h
    - cron: '0 */2 * * *'
  workflow_dispatch: # permite disparo manual pelo GitHub

jobs:
  run-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: CRON_SECRET
    steps:
      - name: Verificar secrets obrigatórios
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Secret APP_URL não está configurado. Acesse Settings → Secrets and variables → Actions e adicione APP_URL com a URL base do app (ex: https://seu-app.vercel.app)."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET não está configurado. Acesse Settings → Secrets and variables → Actions e adicione CRON_SECRET."
            exit 1
          fi
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Disparar agendador de notificações
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/notifications/run")
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Falha no endpoint (status $STATUS)"
            exit 1
          fi
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
